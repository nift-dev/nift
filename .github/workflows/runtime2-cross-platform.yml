name: Runtime 2.0 cross-platform VM subset

# D-077 #4 (owner 2026-11-12 04:25): the documented Linux / macOS / Windows VM test subset of the first
# cross-platform certification (docs/runtime-2/platform-subsets.md; the table is
# tests/runtime2/platform_subset.py). Dispatch only: it never runs on push or pull_request. Pushing the candidate
# and dispatching this workflow each need explicit owner approval (D-077 #6). FreeBSD is not in the first
# certification (D-077 #4).
on:
  workflow_dispatch:
    inputs:
      isolated_revision:
        description: Queue this commit separately while an earlier revision is still running
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runtime2-cross-platform-${{ github.ref }}${{ inputs.isolated_revision && format('-{0}', github.sha) || '' }}
  cancel-in-progress: false

jobs:
  subset:
    name: ${{ matrix.id }} Runtime 2.0 VM subset
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            runner: ubuntu-latest
          - id: macos
            runner: macos-latest
          - id: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    # A hung suite must fail the job, never hold a runner. The subset is a fraction of test-rt-vm (about 52 min
    # locally on Linux for the whole target).
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      # Golden transcripts and witness hashes depend on exact checkout bytes.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      # Action versions are the ones the existing certified workflows use (checkpoint-10-cross-platform.yml,
      # v44-cross-platform.yml). Pin them to commit SHAs before the push (a lookup this preparation did not do:
      # no GitHub access was authorised).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # setup-python only on Windows: its teardown has hung on macOS runners (v44-cross-platform.yml); Linux and
      # macOS use the runner's python3.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
      - name: Install the Windows pseudoconsole test adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'pywinpty==3.1.2 --hash=sha256:d968dc4300b497f048318387781ed9931dc0038815f25b4f642a1749448769cb' |
            Set-Content -Path "$env:RUNNER_TEMP/nift-pty-requirements.txt" -Encoding ascii
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r "$env:RUNNER_TEMP/nift-pty-requirements.txt"
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: make diffutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-winpthreads
      - name: GNU timeout on macOS (diagnostics/run.sh, file_copy_move_freedom.sh)
        if: runner.os == 'macOS'
        run: |
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Platform subset table self-check
        if: runner.os != 'Windows'
        run: python3 tests/runtime2/platform_subset.py --check
      - name: Build Nift and the subset's unit binaries
        id: build-unix
        if: runner.os != 'Windows'
        run: |
          make -j2
          make -j2 .build/rt-parse-dump .build/rt-parser-unit .build/rt-legacy-oracle \
            .build/rt/vm-unit .build/rt/vm-globals-unit .build/rt/vm-modules-unit .build/rt/vm-prepared-parse
      - name: Build Nift and the subset's unit binaries on Windows
        id: build-windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          export PATH="$PATH:$(cygpath -u "$pythonLocation")"
          python --version
          python tests/runtime2/platform_subset.py --check
          make -j2
          make -j2 .build/rt-parse-dump.exe .build/rt-parser-unit.exe .build/rt-legacy-oracle.exe \
            .build/rt/vm-unit.exe .build/rt/vm-globals-unit.exe .build/rt/vm-modules-unit.exe \
            .build/rt/vm-prepared-parse.exe .build/rt-args-count-launcher.exe
          g++ -std=c++17 -Wall -Wextra -static -municode tests/runtime2/trace_launcher_win.cpp \
            -o .build/rt-trace-launcher.exe
      - name: Source-map retry gate on Windows
        if: ${{ !cancelled() && steps.build-windows.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          export PATH="$PATH:$(cygpath -u "$pythonLocation")"
          make test-rt-source-map-retry PYTHON=python
      - name: Capture Windows invocation contract
        if: ${{ !cancelled() && steps.build-windows.outcome == 'success' }}
        shell: msys2 {0}
        env:
          MSYS: winsymlinks:nativestrict
          PYTHONIOENCODING: utf-8
        run: |
          set -e -o pipefail
          export PATH="$PATH:$(cygpath -u "$pythonLocation")"
          NIFT_TEST_BASH=$(cygpath -am /usr/bin/bash.exe)
          export NIFT_TEST_BASH
          python tests/runtime2/args_cmd/args_cmd.py --nift "$(cygpath -am "$PWD/nift.exe")" \
            2>&1 | tee .build/windows-invocation.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && steps.build-windows.outcome == 'success' }}
        with:
          name: runtime2-windows-invocation
          path: .build/windows-invocation.txt
      - name: Capture macOS memory and literal diagnostics
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e -o pipefail
          export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)"
          {
            make .build/darwin-address-limit || exit 1
            .build/darwin-address-limit --probe || exit 1
            result=$(printf 'print(0)\n' | .build/darwin-address-limit 134217728 -- ./nift -) || exit 1
            test "$result" = 0 || exit 1
            echo 'PASS Nift under the native Darwin address-space guard'
            # Probe the exact child limits used by the certification tests.
            # subprocess itself only reports a generic preexec_fn exception.
            python3 -u - <<'PYLIMITS'
          import os
          import resource
          import subprocess
          import sys

          for name, value in (("RLIMIT_AS", 2 << 30), ("RLIMIT_AS", 4 << 30),
                              ("RLIMIT_FSIZE", 256 << 20), ("RLIMIT_FSIZE", 512 << 20)):
              def set_limit():
                  try:
                      kind = getattr(resource, name)
                      before = resource.getrlimit(kind)
                      resource.setrlimit(kind, (value, value))
                      os.write(2, f"{name}: inherited {before}, applied {resource.getrlimit(kind)}\n".encode())
                  except (AttributeError, OSError, ValueError) as error:
                      os.write(2, f"{name}={value}: {type(error).__name__}: {error}\n".encode())
                      raise
              try:
                  probe = subprocess.run([sys.executable, "-c", "pass"], preexec_fn=set_limit, timeout=10)
                  print(f"{name}={value}: probe child exit {probe.returncode}")
              except (subprocess.SubprocessError, OSError) as error:
                  print(f"{name}={value}: probe launch failed: {error}")
          PYLIMITS
            # Link the parser, values and minifier objects in CLI link order.
            if c++ -std=c++17 -O2 -Isrc tests/runtime2/literals/prepared_probe.cpp \
                src/RuntimeValue.o src/EmbeddedMinify.o src/Ast.o -o .build/prepared-literal-probe; then
              .build/prepared-literal-probe
            fi
            python3 -u - <<'PYRSS'
          import os
          import sys
          import tempfile
          sys.path.insert(0, 'tests/runtime2')
          from vm_subset import equality_memory
          with tempfile.TemporaryDirectory() as work:
              failures = equality_memory(os.path.abspath('nift'), work)
          print('\n'.join(failures) if failures else 'PASS equality RSS control')
          PYRSS
            python3 -u tests/runtime2/darwin_equality_rss_probe.py
          } 2>&1 | tee .build/macos-probes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.build-unix.outcome == 'success' }}
        with:
          name: runtime2-macos-probes
          path: .build/macos-probes.txt
      - name: VM subset (Linux, macOS)
        if: ${{ !cancelled() && runner.os != 'Windows' && steps.build-unix.outcome == 'success' }}
        shell: bash
        run: |
          set -e -o pipefail
          # Keep GNU timeout available to test subprocesses with a minimal PATH.
          NIFT_TEST_TIMEOUT=$(command -v timeout)
          export NIFT_TEST_TIMEOUT
          # Use the same physical paths Python fixtures and Nift diagnostics report.
          if [ "$RUNNER_OS" = macOS ]; then
            export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)"
          fi
          mkdir -p .build/platform-subset
          python3 tests/runtime2/platform_subset.py --platform '${{ matrix.id }}' --nift "$PWD/nift" --build .build \
            2>&1 | tee '.build/platform-subset/${{ matrix.id }}.txt'
      - name: VM subset on Windows
        if: ${{ !cancelled() && steps.build-windows.outcome == 'success' }}
        shell: msys2 {0}
        env:
          MSYS: winsymlinks:nativestrict
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -e -o pipefail
          export PATH="$PATH:$(cygpath -u "$pythonLocation")"
          mkdir -p .build/platform-subset
          export VM_PARSE_DUMP="$(cygpath -am "$PWD/.build/rt-parse-dump.exe")"
          # Native Python can resolve bare names through System32 first.
          NIFT_TEST_BASH=$(cygpath -am /usr/bin/bash.exe)
          NIFT_TEST_TIMEOUT=$(cygpath -am /usr/bin/timeout.exe)
          /usr/bin/bash.exe --version >/dev/null
          /usr/bin/timeout.exe --version >/dev/null
          export NIFT_TEST_BASH NIFT_TEST_TIMEOUT
          python tests/runtime2/platform_subset.py --platform windows --nift "$PWD/nift.exe" --build .build \
            2>&1 | tee .build/platform-subset/windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: runtime2-platform-subset-${{ matrix.id }}
          path: .build/platform-subset/
          if-no-files-found: warn
      # A failed VM entry should leave its job red and still let independent gates run.
      - name: Subset make targets (embedding, value layer, kind bits, source map)
        if: ${{ !cancelled() && steps.build-unix.outcome == 'success' }}
        run: make -k test-v45-embed-contracts test-rt-value test-runtime2-kind-bits test-rt-source-map
      # D-090: the certification guard is a required gate. It checks the certify plan, which is platform independent,
      # so it runs on the Linux job only (platform-subsets.md gives the macOS and Windows reasons).
      - name: Certification guard (required gate, D-090)
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build-unix.outcome == 'success' }}
        run: make test-runtime2-certification-guard
      - name: Subset make targets on Windows
        if: ${{ !cancelled() && steps.build-windows.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          export PATH="$PATH:$(cygpath -u "$pythonLocation")"
          make -k test-v45-embed-contracts test-rt-value test-runtime2-kind-bits test-rt-source-map-unit
