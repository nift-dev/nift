name: Retained v4.0.12 Chocolatey local-install diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # Incident-specific retained artifact for the v4.0.12 release. Both the
  # release run and the artifact ID are pinned together so the workflow cannot
  # be pointed at an unrelated artifact while pretending it is this one.
  ARTIFACT_RUN_ID: '34467451324'
  ARTIFACT_ID: '10148170622'
  EXPECTED_SHA256: 'f1709b315ad90d58ae01fbb0b83cee841f8bb273ba15fd1de87467498a67a2b2'
  EXPECTED_VERSION: '4.0.12'

jobs:
  local-install:
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: retained
      - name: Verify retained artifact hash and exactly one nupkg
        shell: pwsh
        run: |
          $nupkgs = @(Get-ChildItem retained -Filter *.nupkg)
          if ($nupkgs.Count -ne 1) {
            throw "expected exactly one .nupkg, found $($nupkgs.Count)"
          }
          $nupkg = $nupkgs[0]
          $expected = $env:EXPECTED_SHA256.ToLowerInvariant()
          $actual = (Get-FileHash $nupkg.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 mismatch: expected $expected, got $actual"
          }
          "NUPKG=$($nupkg.FullName)" >> $env:GITHUB_ENV
          Write-Host "artifact verified: $($nupkg.Name) sha256=$actual"
      - name: Configure local-only Chocolatey source
        shell: pwsh
        run: |
          New-Item local-repo -ItemType Directory -Force | Out-Null
          Copy-Item $env:NUPKG local-repo/
          $sourceName = 'nift-local-install'
          choco source remove --name="$sourceName" --confirm >$null 2>&1 || $true
          choco source add --name="$sourceName" --source="$PWD\local-repo" --priority=1 --confirm
          choco source disable --name="chocolatey" --confirm
      - name: Install exact local .nupkg (community feed isolated)
        shell: pwsh
        run: |
          choco install nift --version $env:EXPECTED_VERSION -s nift-local-install -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install failed with exit code $LASTEXITCODE" }
      - name: Locate and smoke nift.exe
        shell: pwsh
        run: |
          $shim = Get-Command nift -ErrorAction Stop
          $toolsExe = Get-ChildItem "$env:ChocolateyInstall\lib\nift" -Recurse -Filter nift.exe |
            Where-Object { $_.FullName -notmatch '\\bin\\' } |
            Select-Object -First 1
          if (-not $toolsExe) { throw 'nift.exe not found under Chocolatey lib\nift' }
          "SHIM=$($shim.Source)" >> $env:GITHUB_ENV
          "TOOLS_EXE=$($toolsExe.FullName)" >> $env:GITHUB_ENV
          $v = & $toolsExe.FullName version
          if ($LASTEXITCODE -ne 0) { throw "nift version failed: $v" }
          $expectedVersion = [regex]::Escape($env:EXPECTED_VERSION)
          if ($v -notmatch "^Nift v$expectedVersion(?: |$)") {
            throw "version mismatch: expected Nift v$env:EXPECTED_VERSION, got $v"
          }
          Write-Host "shim: $($shim.Source)"
          Write-Host "tools exe: $($toolsExe.FullName)"
          Write-Host "reported: $v"
      - name: Minimal generated-project build
        shell: pwsh
        run: |
          $proj = Join-Path $env:RUNNER_TEMP 'choco-install-proj'
          New-Item $proj -ItemType Directory -Force | Out-Null
          Push-Location $proj
          & $env:TOOLS_EXE init
          if ($LASTEXITCODE -ne 0) { throw "nift init failed" }
          & $env:TOOLS_EXE build
          if ($LASTEXITCODE -ne 0) { throw "nift build failed" }
          if (-not (Test-Path 'public\index.html')) { throw 'public/index.html was not produced' }
          Pop-Location
          Write-Host "minimal project build OK: $proj"
      - name: Uninstall package
        shell: pwsh
        run: |
          choco uninstall nift -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco uninstall failed with exit code $LASTEXITCODE" }
      - name: Verify installed files and shims removed
        shell: pwsh
        run: |
          $libDir = Join-Path $env:ChocolateyInstall 'lib\nift'
          $binShim = Join-Path $env:ChocolateyInstall 'bin\nift.exe'
          if (Test-Path $libDir) { throw "lib\nift still present: $libDir" }
          if (Test-Path $binShim) { throw "shim still present: $binShim" }
          $residual = Get-ChildItem "$env:ChocolateyInstall\lib" -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'nift' }
          if ($residual) { throw "residual nift executable: $($residual.FullName)" }
          Write-Host 'uninstall verified: lib\nift removed, shim removed, no residual executables'
      - name: Restore Chocolatey default source
        if: always()
        shell: pwsh
        run: |
          choco source enable --name="chocolatey" --confirm
          choco source remove --name="nift-local-install" --confirm
