name: packaging matrix (build-only, non-publishing)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'minifypp/**'
      - 'jsonic/**'
      - 'bindings/**'
      - 'packaging/**'
      - 'Makefile'
  workflow_dispatch:

# Build-only: NO environment is attached, so no publishing job can run.
permissions:
  contents: read

jobs:
  matrix:
    name: package ${{ matrix.target }} (build + clean-consumer smoke)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-x86_64
            os: macos-13
          - target: macos-arm64
            os: macos-latest
          - target: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install g++ (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config
      - name: Build + smoke package target
        shell: bash
        run: |
          make -j2
          make embed
          NIFT_BIN=./nift; [ -f ./nift.exe ] && NIFT_BIN=./nift.exe; VERSION="$("$NIFT_BIN" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          bash packaging/matrix-build.sh "${{ matrix.target }}" "$VERSION"
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nift-package-${{ matrix.target }}
          path: dist/*/${{ matrix.target }}/
          if-no-files-found: error