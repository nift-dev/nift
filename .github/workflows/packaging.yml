name: packaging matrix (build-only, non-publishing)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'minifypp/**'
      - 'jsonic/**'
      - 'bindings/**'
      - 'packaging/**'
      - 'Makefile'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:

# Build-only: NO environment is attached, so no publishing job can run.
permissions:
  contents: read

jobs:
  native-matrix:
    name: native ${{ matrix.target }} (build + enforced clean-consumer smoke)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-x86_64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-latest
          - target: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install g++/pkg-config (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - name: Build + smoke package target
        shell: bash
        run: |
          make -j2
          make embed
          NIFT_BIN=./nift; [ -f ./nift.exe ] && NIFT_BIN=./nift.exe
          VERSION="$("$NIFT_BIN" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          set +e
          bash packaging/matrix-build.sh "${{ matrix.target }}" "$VERSION" --require-smoke > /tmp/matrix.out 2>&1
          rc=$?
          set -e
          cat /tmp/matrix.out
          [ $rc -eq 0 ] || exit $rc
          grep -q 'SMOKE_EXECUTED=1' /tmp/matrix.out || { echo "FAIL: SMOKE_EXECUTED marker missing" >&2; exit 1; }
      - name: Go static consumer (this target; otool -L / objdump proof)
        if: ${{ matrix.target == 'macos-arm64' || matrix.target == 'macos-x86_64' || matrix.target == 'windows-x86_64' }}
        shell: bash
        run: |
          export PKG_CONFIG_PATH="$PWD/dist/embed-prefix/lib/pkgconfig"
          rm -rf /tmp/gomod /tmp/gocons && mkdir -p /tmp/gomod /tmp/gocons
          tar -cf - bindings/go | ( cd /tmp/gomod && tar -xf - --strip-components=2 )
          cd /tmp/gocons
          printf 'module example.com/consumer\n\ngo 1.26\n\nrequire nift.dev/embed/v4 v4.0.7\n\nreplace nift.dev/embed/v4 => /tmp/gomod\n' > go.mod
          cat > main.go <<'GO'
          package main
          import ("fmt"; "os"; nift "nift.dev/embed/v4")
          func main() { if err := nift.ABICompat(); err != nil { os.Exit(1) }; e := nift.NewEngine(); defer e.Close(); e.SetString("site","nift"); r, err := e.RenderText("<p>$[site]</p>"); if err != nil || !r.OK || r.Output != "<p>nift</p>" { os.Exit(1) }; fmt.Println("go render OK:", r.Output) }
          GO
          go mod tidy && go build -o consumer .
          (command -v otool >/dev/null 2>&1 && otool -L consumer 2>/dev/null | grep -qi nift && { echo "FAIL: go consumer links shared nift" >&2; exit 1; } || true)
          (command -v objdump >/dev/null 2>&1 && objdump -p consumer 2>/dev/null | grep -qiE 'nift.*dll' && { echo "FAIL: go consumer links shared nift" >&2; exit 1; } || true)
          ./consumer
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nift-package-${{ matrix.target }}
          path: dist/*/${{ matrix.target }}/
          if-no-files-found: error

  language-packages:
    name: language packages (build-only, non-publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install python dev + build deps
        run: |
          sudo apt-get update && sudo apt-get install -y g++ pkg-config python3-dev
          python3 -m pip install setuptools wheel
      - name: Python wheel + self-contained sdist
        run: |
          make -j2
          VERSION="$(./nift --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          rm -rf bindings/python/native
          mkdir -p bindings/python/native
          cp -r src bindings/python/native/src
          cp -r include bindings/python/native/include
          cp -r minifypp bindings/python/native/minifypp
          cp -r jsonic bindings/python/native/jsonic
          ( cd bindings/python && NIFT_VERSION="$VERSION" python3 setup.py sdist --dist-dir /tmp/pydist )
          SDIST="$(ls /tmp/pydist/nift-$VERSION.tar.gz | head -1)"
          mkdir -p /tmp/pysrc && tar xzf "$SDIST" -C /tmp/pysrc
          ( cd /tmp/pysrc/nift-$VERSION && NIFT_VERSION="$VERSION" python3 -m pip wheel --no-deps --no-build-isolation -w /tmp/pydist . )
          ls /tmp/pydist
      - name: NuGet (RID asset) + npm (addon) + Go (static consumer) builds
        run: |
          make embed
          make node-binding
          VERSION="$(./nift --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          ( cd bindings/csharp/src/Nift && dotnet pack -v q --nologo -p:Version="$VERSION" -o /tmp/nugetdist )
          python3 - "$VERSION" <<'PY'
          import json, sys
          import shutil, subprocess, os
          v = sys.argv[1]
          os.makedirs("/tmp/npmdist", exist_ok=True)
          import tempfile
          tmp = tempfile.mkdtemp()
          shutil.copytree("bindings/node", tmp + "/node", dirs_exist_ok=True)
          p = json.load(open(tmp + "/node/package.json")); p["version"] = v; json.dump(p, open(tmp + "/node/package.json","w"), indent=2)
          subprocess.run(["npm","pack","--pack-destination","/tmp/npmdist"], cwd=tmp + "/node", check=True, capture_output=True)
          PY
          ls /tmp/nugetdist /tmp/npmdist
      - name: Durable synchronized-version derivation regression
        run: bash packaging/test-version-derivation.sh
      - name: Clean-consumer Python install/load/render
        run: |
          WHEEL="$(ls /tmp/pydist/nift-*.whl | head -1)"
          python3 -m venv /tmp/pyvenv
          /tmp/pyvenv/bin/pip install --no-index "$WHEEL"
          cd /tmp && /tmp/pyvenv/bin/python -c "import nift, importlib.metadata; assert importlib.metadata.version('nift').startswith('$(./nift --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')'); e=nift.Engine.new(); r=e.render_text('<p>hi</p>'); assert r.ok and r.output=='<p>hi</p>'; print('python clean-consumer render OK')"
      - name: Clean-consumer npm install/load/render
        run: |
          TGZ="$(ls /tmp/npmdist/nift-*.tgz | head -1)"
          rm -rf /tmp/npmconsumer && mkdir -p /tmp/npmconsumer/node_modules
          tar xzf "$TGZ" -C /tmp/npmconsumer/node_modules && mv /tmp/npmconsumer/node_modules/package /tmp/npmconsumer/node_modules/nift
          node -e "const n=require('/tmp/npmconsumer/node_modules/nift'); (async()=>{const e=n.Engine.new(); const r=await e.renderText('<p>hi</p>'); if(!r.ok||r.output!=='<p>hi</p>'){process.exit(1)} console.log('npm clean-consumer render OK'); e.close();})()"
      - name: Clean-consumer NuGet install/load/render
        run: |
          NUPKG="$(ls /tmp/nugetdist/Nift.*.nupkg | head -1)"
          rm -rf /tmp/csconsumer && mkdir -p /tmp/csconsumer
          cd /tmp/csconsumer
          printf '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>' > consumer.csproj
          cat > Program.cs <<'CS'
          using System; using Nift;
          class P { static int Main() {
            var e = Engine.New(); e.SetString("site","nift");
            var r = e.RenderText("<p>$[site]</p>");
            if (!r.Ok || r.Output != "<p>nift</p>") return 1;
            Console.WriteLine("nuget clean-consumer render OK"); return 0;
          } }
          CS
          mkdir -p /tmp/nusrc && cp "$NUPKG" /tmp/nusrc/
          dotnet add package Nift --version "$(basename "$NUPKG" .nupkg | sed 's/Nift.//')" --source /tmp/nusrc >/dev/null 2>&1
          dotnet run
      - name: Go external consumer (static, no libnift_c.so)
        shell: bash
        run: |
          make embed
          export PKG_CONFIG_PATH="$PWD/dist/embed-prefix/lib/pkgconfig"
          rm -rf /tmp/gomod /tmp/goconsumer
          mkdir -p /tmp/gomod /tmp/goconsumer
          tar -cf - bindings/go | ( cd /tmp/gomod && tar -xf - --strip-components=2 )
          cd /tmp/goconsumer
          printf 'module example.com/consumer\n\ngo 1.26\n\nrequire nift.dev/embed/v4 v4.0.7\n\nreplace nift.dev/embed/v4 => /tmp/gomod\n' > go.mod
          cat > main.go <<'GO'
          package main
          import ("fmt"; "os"; nift "nift.dev/embed/v4")
          func main() {
            if err := nift.ABICompat(); err != nil { fmt.Fprintln(os.Stderr, err); os.Exit(1) }
            e := nift.NewEngine(); defer e.Close()
            e.SetString("site","nift")
            r, err := e.RenderText("<p>$[site]</p>")
            if err != nil || !r.OK || r.Output != "<p>nift</p>" { os.Exit(1) }
            fmt.Println("go render OK:", r.Output)
          }
          GO
          go mod tidy >/dev/null 2>&1 && go build -o consumer . >/dev/null 2>&1
          ldd consumer 2>/dev/null | grep -qi nift && { echo "FAIL: go consumer links shared nift" >&2; exit 1; } || true
          ./consumer
      - name: Collect language packages into the workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pkg-artifacts"
          cp -r /tmp/pydist/* "$GITHUB_WORKSPACE/pkg-artifacts/" 2>/dev/null || true
          cp -r /tmp/nugetdist/* "$GITHUB_WORKSPACE/pkg-artifacts/" 2>/dev/null || true
          cp -r /tmp/npmdist/* "$GITHUB_WORKSPACE/pkg-artifacts/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/pkg-artifacts"
      - name: Upload language package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nift-language-packages
          path: pkg-artifacts/
          if-no-files-found: error