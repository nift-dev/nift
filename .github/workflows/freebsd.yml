name: FreeBSD

# Build and portable regression scripts in a real FreeBSD VM (QEMU on an
# ubuntu-latest runner). Follows the FreeBSD portability work contributed by
# @NuLL3rr0r in #1. Read-only token; no secrets are used, so pull requests from
# forks run with the same (absent) privileges as any other PR job.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD 14 amd64 build and regression
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: nift
          fetch-depth: 0
      - name: Build and test in FreeBSD
        # vmactions/freebsd-vm v1.5.9, pinned by commit.
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: "14"
          arch: x86_64
          cpu: 2
          mem: 6144
          copyback: true
          prepare: |
            pkg install -y gmake bash python3 git rsync coreutils sqlite3
          # The VM runs commands as root; the build and tests run as an
          # unprivileged user so permission-dependent suites are exercised.
          run: |
            set -eu
            pw useradd niftci -m -s /bin/sh
            chown -R niftci "$PWD"
            su niftci -c "cd '$PWD/nift' && bash scripts/ci_freebsd_memory_diagnostic.sh"
      - name: Check guest results after copying logs
        run: |
          test "$(cat nift/.build/freebsd-ci/guest-status.txt)" = '0'
      - name: Summary
        if: always()
        run: |
          cat nift/.build/freebsd-ci/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary (VM step failed before testing)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f nift/.build/freebsd-ci/runtime2/summary.txt ]; then
            cat nift/.build/freebsd-ci/runtime2/summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: freebsd-ci-logs
          path: nift/.build/freebsd-ci/
          include-hidden-files: true
          if-no-files-found: warn
