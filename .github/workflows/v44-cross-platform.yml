name: v4.4 cross-platform

on:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'src/**'
      - 'tests/v44_*'
      - 'tests/package_*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.id }} v4.4 portable surface
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            runner: ubuntu-latest
          - id: macos
            runner: macos-latest
          - id: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-winpthreads
      - name: Build Nift
        if: runner.os != 'Windows'
        run: make -j2
      - name: Build Nift on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -j2
      - name: v4.4 execution shell + language foundation
        if: runner.os != 'Windows'
        run: make test-v44-execution-shell test-v44-language-foundation
      - name: v4.4 execution shell + language foundation on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test-v44-execution-shell test-v44-language-foundation
      - name: v4.4 shell restricted (glob/history/completion/PTY/restriction)
        if: runner.os != 'Windows'
        run: make test-v44-shell-restricted
      - name: v4.4 shell restricted on Windows (glob/history/completion/restriction)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test-v44-shell-restricted
      - name: v4.4 automation + hooks
        if: runner.os != 'Windows'
        run: make test-v44-automation test-v44-hooks
      - name: v4.4 automation + hooks on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test-v44-automation test-v44-hooks
      - name: v4.4 local packages (sqlite dogfood skips if sqlite3 absent)
        if: runner.os != 'Windows'
        run: make test-v44-packages
      - name: v4.4 local packages on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test-v44-packages
      - name: Version consistency gate (executable + Snap metadata)
        run: make test-version-consistency
      - name: Version consistency gate on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test-version-consistency