name: v4.4/v4.5 cross-platform

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v44-cross-platform.yml'
      - 'Makefile'
      - 'src/**'
      - 'tests/parser_*'
      - 'tests/v44_*'
      - 'tests/v45_*'
      - 'tests/package_*'
  pull_request:
    paths:
      - '.github/workflows/v44-cross-platform.yml'
      - 'Makefile'
      - 'src/**'
      - 'tests/parser_*'
      - 'tests/v44_*'
      - 'tests/v45_*'
      - 'tests/package_*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.id }} v4.4/v4.5 portable surface
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            runner: ubuntu-latest
          - id: macos
            runner: macos-latest
          - id: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    # Outer safety boundary: a shell/PTY/process regression must FAIL the job,
    # never consume a runner for an unbounded time. Observed healthy durations
    # are a few minutes per platform; 25 minutes is a generous ceiling.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          path: nift
      # The v4.4 package dogfoods resolve the nift-packages repos as a sibling
      # `nift-packages/` directory (matching the Makefile's
      # $(CURDIR)/../nift-packages), pinned to the coherent v4.4 package set.
      - uses: actions/checkout@v5
        with:
          repository: nift-packages/sqlite
          ref: e2f6e192f5a72e8220567952170fc814566aa400
          path: nift-packages/sqlite
      - uses: actions/checkout@v5
        with:
          repository: nift-packages/curl
          ref: 61e8dd5d2a89c978cfe03f1be00a5df8c226b7d6
          path: nift-packages/curl
      - uses: actions/checkout@v5
        with:
          repository: nift-packages/postgres
          ref: 42873336b721a69d4132541523c05b816ba489eb
          path: nift-packages/postgres
      - uses: actions/checkout@v5
        with:
          repository: nift-packages/mysql
          ref: 4526f3794bac2ad8b6d80d087d0abab974eed38c
          path: nift-packages/mysql
      - uses: actions/checkout@v5
        with:
          repository: nift-packages/redis
          ref: 7719fa88f0bb4c42fbae1b2cac3a8cb675a4a978
          path: nift-packages/redis
      - uses: actions/checkout@v5
        with:
          repository: nift-packages/vips
          ref: 735b9965d6d6c365b4195f0454ded31e577dc5f1
          path: nift-packages/vips
      - uses: actions/checkout@v5
        with:
          repository: nift-packages/imagemagick
          ref: dda5437fb20ca92045cea901323c2bd2399f38a8
          path: nift-packages/imagemagick
      # Keep setup-python Windows-only: the native-runtime wall requires it,
      # while setup-python teardown has hung on macOS runners.
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.x'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-winpthreads
      - name: Build Nift
        if: runner.os != 'Windows'
        run: make -C nift -j2
      - name: Build Nift on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C nift -j2
      - name: v4.4 execution shell + language foundation
        timeout-minutes: 6
        if: runner.os != 'Windows'
        run: make -C nift test-v44-execution-shell test-v44-language-foundation
      - name: v4.4 execution shell + language foundation on Windows
        timeout-minutes: 6
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C nift test-v44-execution-shell test-v44-language-foundation
      - name: v4.4 shell restricted (glob/history/completion/PTY/restriction)
        timeout-minutes: 6
        if: runner.os != 'Windows'
        run: make -C nift test-v44-shell-restricted
      - name: v4.4 shell restricted on Windows (glob/history/completion/restriction)
        timeout-minutes: 6
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C nift test-v44-shell-restricted
      - name: v4.4 automation + hooks
        timeout-minutes: 6
        if: runner.os != 'Windows'
        run: make -C nift test-v44-automation test-v44-hooks
      - name: v4.4 automation + hooks on Windows
        timeout-minutes: 6
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C nift test-v44-automation test-v44-hooks
      - name: v4.5 native runtime wall
        timeout-minutes: 6
        if: runner.os != 'Windows'
        run: make -C nift test-v45-native-runtime
      - name: v4.5 native runtime wall on Windows
        timeout-minutes: 6
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="$PATH:$(cygpath -u "$pythonLocation")"
          python3 --version
          make -C nift test-v45-native-runtime
      - name: v4.5 focused embedding contracts
        timeout-minutes: 10
        if: runner.os != 'Windows'
        run: make -C nift -j2 test-v45-embed-contracts
      - name: v4.5 focused embedding contracts on Windows
        timeout-minutes: 10
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C nift -j2 test-v45-embed-contracts
      - name: v4.4 local packages (sqlite dogfood skips if sqlite3 absent)
        timeout-minutes: 6
        if: runner.os != 'Windows'
        run: make -C nift test-v44-packages
      - name: v4.4 local packages on Windows
        timeout-minutes: 6
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="$PATH:$(cygpath -u "$pythonLocation")"
          python3 --version
          make -C nift test-v44-packages
      - name: Version consistency gate (executable + Snap metadata)
        timeout-minutes: 6
        run: make -C nift test-version-consistency
      - name: Version consistency gate on Windows
        timeout-minutes: 6
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # The runner installs Python but it is not on the msys2 shell PATH
          # (pythonLocation is not exported into this shell); locate the newest
          # hosted Python and expose it so the version-consistency gate actually
          # certifies on Windows instead of skipping.
          if ! command -v python3 >/dev/null 2>&1; then
            PY="$(ls -d /c/hostedtoolcache/windows/Python/*/x64 2>/dev/null | sort -V | tail -1)"
            echo "python dir=$PY"
            if [ -n "$PY" ]; then
              export PATH="$PATH:$PY"
            fi
            echo "python3 -> $(command -v python3 || echo NONE)"
          fi
          make -C nift test-version-consistency
