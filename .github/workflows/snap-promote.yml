name: Promote completed Snap builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version already completed on latest/edge (for example 4.0.12)'
        required: true
        type: string
      mode:
        description: 'Read-only status/check-ready, or promote-candidate / promote-stable'
        required: true
        default: status
        type: choice
        options:
          - status
          - check-ready
          - candidate
          - stable
      promote:
        description: 'Explicit confirmation: set true to allow a mutation (candidate or stable)'
        required: true
        default: false
        type: boolean

env:
  SNAPCRAFT_SNAP_REVISION: "18514"
  SNAPCRAFT_EXPECTED_VERSION: "9.0.1"

jobs:
  validate_version_consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: v${{ inputs.version }}
      - name: Fail-closed version consistency at the release tag
        shell: bash
        run: |
          python3 scripts/check_version_consistency.py --expected "${{ inputs.version }}"

  promote:
    needs: validate_version_consistency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: nift-snap-store-promotion
      cancel-in-progress: false
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      NIFT_SNAP_VERSION: ${{ inputs.version }}
      # The coordinator only mutates channels in candidate/stable modes and
      # requires this explicit confirmation; status/check-ready are read-only.
      NIFT_SNAP_CONFIRM: ${{ inputs.promote && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: v${{ inputs.version }}
      - name: Validate requested version at the release tag
        shell: bash
        run: |
          case "$NIFT_SNAP_VERSION" in
            ''|*[!0-9.]*) echo "version must contain only digits and dots" >&2; exit 1 ;;
          esac
          package_version="$(sed -nE "s/^version: '([^']+)'/\1/p" snap/snapcraft.yaml)"
          test "$package_version" = "$NIFT_SNAP_VERSION"
      - name: Require explicit confirmation for mutations
        shell: bash
        run: |
          case "${{ inputs.mode }}" in
            candidate|stable)
              test "${{ inputs.promote }}" = "true" || { echo "FAIL: ${{ inputs.mode }} promotion requires promote=true" >&2; exit 1; }
              ;;
          esac
      - name: Install and verify pinned snapcraft
        shell: bash
        run: bash packaging/snapcraft-pin.sh
      - name: Run coordinator (status/check-ready read-only; mutations only with promote=true)
        shell: bash
        run: |
          case "${{ inputs.mode }}" in
            status)      python3 packaging/snap_release.py --status ;;
            check-ready) python3 packaging/snap_release.py --check-ready ;;
            candidate)   python3 packaging/snap_release.py --promote-candidate ;;
            stable)      python3 packaging/snap_release.py --promote-stable ;;
            *) echo "unknown mode: ${{ inputs.mode }}" >&2; exit 2 ;;
          esac