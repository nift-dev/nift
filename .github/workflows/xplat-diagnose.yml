name: xplat diagnose (rt2-xplat-fixes only; not for merge)

# Diagnostic-only workflow for the 2026-10-21 cross-platform failures.
# It never replaces or weakens a test: it reruns the failing checks with more
# output, and runs the steps that the failures prevented from running.
on:
  push:
    branches: [rt2-xplat-fixes]

permissions:
  contents: read

jobs:
  macos-serve:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build
        run: make -j3 nift
      - name: Python seen by nift serve
        run: |
          set -x
          command -v python3 python || true
          python3 --version || true
          /usr/bin/python3 --version || true
          echo "PATH=$PATH"
      - name: Manual serve start (stdout/stderr, process tree)
        run: |
          set -x
          d=$(mktemp -d); mkdir -p "$d/www"; echo hi > "$d/www/index.html"; cd "$d"
          "$GITHUB_WORKSPACE/nift" serve --dir www --port 18765 > out.txt 2> err.txt &
          pid=$!
          sleep 6
          echo "--- stdout"; cat out.txt; echo "--- stderr"; cat err.txt
          ps -o pid,ppid,command -p $pid || true
          pgrep -fl http.server || true
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:18765/ || true
          kill -INT $pid || true; sleep 2; kill -KILL $pid 2>/dev/null || true
      - name: test-serve (unchanged)
        run: make test-serve
        continue-on-error: true
      - name: Steps the serve failure skipped (corpus, ownership)
        run: |
          make test-ownership-unit 2>&1 | tail -20 || true

  macos-serve-after-contracts:
    # The serve test failed only after the contract suites in the same job.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build
        run: make -j2
      - name: Contract suites as in checkpoint 10
        run: make test-v410-build-pipeline test-v410-file-buffer-parity test-v410-file-buffer-guard test-v410-large-string-parity test-v410-large-string-guard test-v410-filesystem-recipe-parity test-v410-filesystem-recipe-guard test-v410-string-replace-parity test-v410-native-dispatch-parity test-v410-glob-parity test-v410-glob-relative-guard test-v410-glob-prefix-parity test-v410-glob-prefix-guard test-v49-selector-parity test-v49-glob-order test-v49-glob-key-guard test-v49-json-preflight-guard test-runtime-value test-v48-callback-parity test-v48-callback-guard test-v410-sort-factory-parity test-v410-callback-overlay-parity test-v410-callback-overlay-guard test-v410-object-member-parity test-v410-object-member-unit test-v410-object-member-guard test-consumer-snapshots test-build-lock-orphan test-dependency-status test-dependency-path-identity test-process-hardening
      - name: State before serve (processes, ports, env)
        run: |
          ps -axo pid,ppid,etime,command | grep -Ei "nift|python|http" | grep -v grep || true
          lsof -nP -iTCP -sTCP:LISTEN | head -20 || true
          env | grep -Ei "^PY|^NIFT|TMPDIR" || true
      - name: serve smoke, copy that also prints each server's stdout on failure
        run: |
          cp tests/serve_smoke.sh /tmp/serve_diag.sh
          python3 - <<'PY'
          import re
          p='/tmp/serve_diag.sh'; s=open(p).read()
          extra='[ -n "${2:-}" ] && [ -f "${2%.err}.out" ] && sed "s/^/  out: /" "${2%.err}.out"; ps -axo pid,ppid,command | grep -i serve | grep -v grep || true; '
          assert s.count('bad() { fail=1; ')==1
          s=s.replace('bad() { fail=1; ','bad() { fail=1; '+extra,1); open(p,'w').write(s)
          PY
          grep -n "^bad()" /tmp/serve_diag.sh
          cp /tmp/serve_diag.sh tests/serve_diag.sh
          NIFT_BIN="$PWD/nift" bash tests/serve_diag.sh || echo "serve diag FAILED"

  windows-recovery:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make diffutils python mingw-w64-ucrt-x86_64-gcc
      - name: Build
        shell: msys2 {0}
        run: make -j2
      - name: consumer snapshots with the failing assertion's output (copy of the test)
        shell: msys2 {0}
        run: |
          cp tests/consumer_dependency_snapshots.py /tmp/cds_diag.py
          sed -i 's/r=subprocess.run(\[binary,.build.\],cwd=p,capture_output=True,text=True);assert r.returncode!=0$/r=subprocess.run([binary,"build"],cwd=p,capture_output=True,text=True);assert r.returncode!=0,("DIAG build after kill succeeded",r.returncode,r.stdout,r.stderr,sorted(x.name for x in (p\/".nift").iterdir()))/' /tmp/cds_diag.py
          grep -n "DIAG" /tmp/cds_diag.py || echo "diagnostic sed did not apply"
          cp /tmp/cds_diag.py tests/cds_diag.py
          python3 tests/cds_diag.py --nift ./nift.exe --output .build/cds-diag.json || true
      - name: Remaining Windows checks the failure skipped
        shell: msys2 {0}
        env:
          MSYS: winsymlinks:nativestrict
        run: |
          make test-process-hardening || echo "test-process-hardening FAILED"
          make test-sha256 || echo "test-sha256 FAILED"
