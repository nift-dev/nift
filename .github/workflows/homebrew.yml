name: Homebrew

on:
  workflow_call:
    inputs:
      version:
        description: Existing GitHub release version, with or without v prefix
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing GitHub release version, with or without v prefix
        required: true
  pull_request:
    paths:
      - 'packaging/homebrew/**'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/homebrew.yml'

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-latest
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          core: true
          cask: false
      - name: Resolve formula
        id: formula
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="4.0.2"
            archive_url="https://github.com/nift-dev/nift/archive/${GITHUB_SHA}.tar.gz"
          else
            version="${{ inputs.version }}"
            version="${version#v}"
            archive_url="https://github.com/nift-dev/nift/archive/refs/tags/v${version}.tar.gz"
          fi
          mkdir -p .build/homebrew
          curl --fail --location --retry 3 "$archive_url" --output .build/homebrew/source.tar.gz
          checksum="$(shasum -a 256 .build/homebrew/source.tar.gz | awk '{print $1}')"
          sed -e "s|@URL@|$archive_url|g" -e "s/@SHA256@/$checksum/g" \
            packaging/homebrew/nift.rb.in > .build/homebrew/nift.rb
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_FROM_API: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          brew tap-new --no-git nift-dev/nift-ci
          tap_dir="$(brew --repository nift-dev/nift-ci)"
          cp .build/homebrew/nift.rb "$tap_dir/Formula/nift.rb"
          brew install --build-from-source nift-dev/nift-ci/nift
          brew test nift-dev/nift-ci/nift
      - uses: actions/upload-artifact@v4
        with:
          name: nift-homebrew-${{ matrix.platform }}
          path: .build/homebrew/nift.rb
