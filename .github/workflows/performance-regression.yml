name: Performance regression guards

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/*scaling_benchmark.py'
      - 'tests/recovery_epoch_guard.cpp'
      - 'tests/v410_allocation_guard.py'
      - 'Makefile'
      - 'docs/guarantees/**'
      - '.github/workflows/performance-regression.yml'
      - '.github/workflows/test-integrity.yml'
      - '.github/workflows/checkpoint-10-cross-platform.yml'
      - '.github/workflows/init-targets.yml'
      - '.github/workflows/nightly-deep.yml'
      - '.github/workflows/distribution-verification.yml'
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'tests/*scaling_benchmark.py'
      - 'tests/recovery_epoch_guard.cpp'
      - 'tests/v410_allocation_guard.py'
      - 'Makefile'
      - 'docs/guarantees/**'
      - '.github/workflows/performance-regression.yml'
      - '.github/workflows/test-integrity.yml'
      - '.github/workflows/checkpoint-10-cross-platform.yml'
      - '.github/workflows/init-targets.yml'
      - '.github/workflows/nightly-deep.yml'
      - '.github/workflows/distribution-verification.yml'
  workflow_dispatch:

jobs:
  scaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build Nift
        run: make -j2
      - name: Guard tracking, full-build scaling and recovery epochs
        run: make test-performance-scaling
      - name: Install deterministic instruction profiler
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Guard grouping construction instruction scaling
        run: make test-v49-group-scaling
      - name: Guard capture and native-dispatch allocation slopes
        run: make test-v410-allocation-guard
