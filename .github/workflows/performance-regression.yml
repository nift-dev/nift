name: Performance regression guards

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/*scaling_benchmark.py'
      - 'tests/recovery_epoch_guard.cpp'
      - 'Makefile'
      - 'docs/guarantees/**'
      - '.github/workflows/performance-regression.yml'
      - '.github/workflows/test-integrity.yml'
      - '.github/workflows/checkpoint-10-cross-platform.yml'
      - '.github/workflows/init-targets.yml'
      - '.github/workflows/nightly-deep.yml'
      - '.github/workflows/distribution-verification.yml'
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'tests/*scaling_benchmark.py'
      - 'tests/recovery_epoch_guard.cpp'
      - 'Makefile'
      - 'docs/guarantees/**'
      - '.github/workflows/performance-regression.yml'
      - '.github/workflows/test-integrity.yml'
      - '.github/workflows/checkpoint-10-cross-platform.yml'
      - '.github/workflows/init-targets.yml'
      - '.github/workflows/nightly-deep.yml'
      - '.github/workflows/distribution-verification.yml'

jobs:
  scaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Nift
        run: make -j2
      - name: Guard tracking, full-build scaling and recovery epochs
        run: make test-performance-scaling
