name: Test integrity guards

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'jsonic/**'
      - 'minifypp/**'
      - 'bindings/**'
      - 'Makefile'
      - 'docs/guarantees/**'
      - '.github/workflows/test-integrity.yml'
      - '.github/workflows/performance-regression.yml'
      - '.github/workflows/checkpoint-10-cross-platform.yml'
      - '.github/workflows/init-targets.yml'
      - '.github/workflows/nightly-deep.yml'
      - '.github/workflows/distribution-verification.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'jsonic/**'
      - 'minifypp/**'
      - 'bindings/**'
      - 'Makefile'
      - 'docs/guarantees/**'
      - '.github/workflows/test-integrity.yml'
      - '.github/workflows/performance-regression.yml'
      - '.github/workflows/checkpoint-10-cross-platform.yml'
      - '.github/workflows/init-targets.yml'
      - '.github/workflows/nightly-deep.yml'
      - '.github/workflows/distribution-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-integrity:
    name: Static test-integrity scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Scan tests and scripts for false-green patterns
        run: |
          python scripts/test_integrity_check.py tests scripts \
            --output .build/bh2/test-integrity-report.json
      - name: Validate guarantee registry structurally (repository-local)
        run: make test-guarantee-registry-ci

  fast-suites:
    name: Fast deterministic contract suites
    needs: static-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Nift
        run: make -j2
      - name: Contract suite
        run: make test-contracts
      - name: Canonical C++ conformance, host seam, C ABI
        run: |
          make test-conformance
          make test-host-seam
          make test-c-abi
          make test-c-abi-c-smoke
      - name: Init targets
        run: make test-init-targets
      - name: Pagination incremental equivalence
        run: make test-pagination-equivalence
      - name: Incremental state-transition adversarial (BH4)
        run: make test-incremental-state-transitions
      - name: Parser/value/composition adversarial (BH5)
        run: make test-parser-value-composition
      - name: Init scaffold functional truth (BH6)
        run: make test-init-functional-truth
      - name: Crash/recovery adversarial (BH7)
        run: make test-crash-recovery
      - name: Complexity invariants (BH8)
        run: make test-complexity-invariants
      - name: Filesystem boundary (BH9)
        run: make test-filesystem-boundary
  binding-gates:
    name: Production binding gates (Go, C#, Node, Python) on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build native libraries + staged prefix
        run: make embed
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - name: Go binding tests
        run: |
          cd bindings/go
          export PKG_CONFIG_PATH="$(pwd)/../../dist/embed-prefix/lib/pkgconfig"
          go test ./...
          go test -race ./...
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: C# binding tests
        run: dotnet run --project bindings/csharp/tests/Nift.Tests/Nift.Tests.csproj
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node binding build + tests
        run: |
          bash bindings/node/build.sh
          node --expose-gc bindings/node/test/nift.test.js
      - name: Install Python dev headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Python binding build + tests
        run: |
          bash bindings/python/build.sh
          cd bindings/python && python3 -m unittest tests.test_nift
      - name: Clean + public aggregate target (make test-bindings)
        run: |
          make clean
          make test-bindings
      - name: Clean + parallel aggregate target (make -j2 test-all)
        run: |
          make clean
          make -j2 test-all
      - name: Build-boundary non-destructive proof (serial)
        run: make test-build-boundary-nondestructive

  aggregate-evidence:
    name: Aggregate evidence (${{ matrix.os }})
    needs: static-integrity
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build Nift
        run: make -j2
      - name: Build-boundary gate (plain make = reduced CLI only)
        run: make test-build-boundary
      - name: Run documented aggregate evidence gate
        run: make bh2-test-integrity
