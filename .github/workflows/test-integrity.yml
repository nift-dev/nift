name: Test integrity guards

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'jsonic/**'
      - 'minifypp/**'
      - 'bindings/**'
      - 'Makefile'
      - 'docs/guarantees/**'
      - '.github/workflows/test-integrity.yml'
      - '.github/workflows/performance-regression.yml'
      - '.github/workflows/checkpoint-10-cross-platform.yml'
      - '.github/workflows/init-targets.yml'
      - '.github/workflows/nightly-deep.yml'
      - '.github/workflows/distribution-verification.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'jsonic/**'
      - 'minifypp/**'
      - 'bindings/**'
      - 'Makefile'
      - 'docs/guarantees/**'
      - '.github/workflows/test-integrity.yml'
      - '.github/workflows/performance-regression.yml'
      - '.github/workflows/checkpoint-10-cross-platform.yml'
      - '.github/workflows/init-targets.yml'
      - '.github/workflows/nightly-deep.yml'
      - '.github/workflows/distribution-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-integrity:
    name: Static test-integrity scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Scan tests and scripts for false-green patterns
        run: |
          python scripts/test_integrity_check.py tests scripts \
            --output .build/bh2/test-integrity-report.json
      - name: Validate guarantee registry structurally (repository-local)
        run: make test-guarantee-registry-ci
      - name: macOS runner-policy consistency guard
        run: make test-macos-runner-policy

  fast-suites:
    name: Fast deterministic contract suites
    needs: static-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build Nift
        run: make -j2
      - name: Contract suite
        run: make test-contracts
      - name: Function-call semantic certification
        run: make test-call-semantics
      - name: Canonical C++ conformance, host seam, C ABI
        run: |
          make test-conformance
          make test-host-seam
          make test-c-abi
          make test-c-abi-c-smoke
      - name: Init targets
        run: make test-init-targets
      - name: Pagination incremental equivalence
        run: make test-pagination-equivalence
      - name: Incremental state-transition adversarial (BH4)
        run: make test-incremental-state-transitions
      - name: Parser/value/composition adversarial (BH5)
        run: make test-parser-value-composition
      - name: Init scaffold functional truth (BH6)
        run: make test-init-functional-truth
      - name: Crash/recovery adversarial (BH7)
        run: make test-crash-recovery
      - name: Complexity invariants (BH8)
        run: make test-complexity-invariants
      - name: Filesystem boundary (BH9)
        run: make test-filesystem-boundary
  binding-gates:
    name: Production binding gates (Go, C#, Node, Python) on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build native libraries + staged prefix
        run: make embed
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bindings/go/go.mod
          cache: false
      - name: Go binding tests
        run: |
          cd bindings/go
          export PKG_CONFIG_PATH="$(pwd)/../../dist/embed-prefix/lib/pkgconfig"
          go test ./...
          go test -race ./...
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: C# binding tests
        run: dotnet run --project bindings/csharp/tests/Nift.Tests/Nift.Tests.csproj
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Node binding build + tests
        run: |
          bash bindings/node/build.sh
          node --expose-gc bindings/node/test/nift.test.js
      - name: Install Python dev headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Python binding build + tests
        run: |
          bash bindings/python/build.sh
          cd bindings/python && python3 -m unittest tests.test_nift
      - name: Clean + public aggregate target (make test-bindings)
        run: |
          make clean
          make test-bindings
  # Give the clean aggregate its own runner lifetime. The binding job
  # has repeatedly been stopped during the second clean build.
  production-aggregate:
    name: Clean Linux test-all aggregate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bindings/go/go.mod
          cache: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install aggregate test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev valgrind
      - name: Clean + parallel aggregate target (make -j2 test-all)
        run: |
          make clean
          # Load-sensitive wall-clock guards are deferred here and run alone in
          # the next step (docs/runtime-2/certification.md); thresholds unchanged.
          # Surface the failing recipes as annotations (readable via the API
          # when job logs are not reachable).
          set +e
          # Stream output so preceding test evidence survives a runner shutdown.
          NIFT_DEFER_LOAD_SENSITIVE=1 make -j2 test-all 2>&1 | tee test-all.log
          statuses=("${PIPESTATUS[@]}")
          set -e
          rc=${statuses[0]}
          if [ "$rc" -eq 0 ]; then rc=${statuses[1]}; fi
          if [ "$rc" -ne 0 ]; then
            # The failing recipes and the lines just before each (GitHub keeps
            # only ten annotations per step, so print the make errors first).
            grep -nE '^make(\[[0-9]+\])?: \*\*\* \[' test-all.log | sed -e 's/%/%25/g' -e 's/^/::error title=failed recipe::/'
            grep -nE '^(FAIL missed|FAIL rt-diff|FAIL \[|DIFF |AssertionError|RuntimeError)' test-all.log | head -8 | sed -e 's/%/%25/g' -e 's/^/::error title=failure::/'
            grep -nE -B4 '^make(\[[0-9]+\])?: \*\*\* \[' test-all.log | grep -vE '^[0-9]+-(g\+\+|cc|mkdir) ' | tail -30 | sed -e 's/%/%25/g' -e 's/^/::error title=context::/'
            exit "$rc"
          fi
      - name: Load-sensitive measurements, exclusively (make test-load-sensitive)
        run: |
          set +e
          make test-load-sensitive > load-sensitive.log 2>&1
          rc=$?
          set -e
          cat load-sensitive.log
          if [ "$rc" -ne 0 ]; then
            grep -nE 'FAIL|regression|blocked|Error' load-sensitive.log | head -8 | sed -e 's/%/%25/g' -e 's/^/::error title=load-sensitive (exclusive)::/'
            exit "$rc"
          fi
      - name: Build-boundary non-destructive proof (serial)
        run: make test-build-boundary-nondestructive

  aggregate-evidence:
    name: Aggregate evidence (${{ matrix.os }})
    needs: static-integrity
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build Nift
        run: make -j2
      - name: Build-boundary gate (plain make = reduced CLI only)
        run: make test-build-boundary
      - name: Run documented aggregate evidence gate
        run: make bh2-test-integrity
