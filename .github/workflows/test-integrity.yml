name: Test integrity guards

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'jsonic/**'
      - 'minifypp/**'
      - 'Makefile'
      - 'docs/guarantees/**'
      - '.github/workflows/test-integrity.yml'
      - '.github/workflows/performance-regression.yml'
      - '.github/workflows/checkpoint-10-cross-platform.yml'
      - '.github/workflows/init-targets.yml'
      - '.github/workflows/nightly-deep.yml'
      - '.github/workflows/distribution-verification.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'jsonic/**'
      - 'minifypp/**'
      - 'Makefile'
      - 'docs/guarantees/**'
      - '.github/workflows/test-integrity.yml'
      - '.github/workflows/performance-regression.yml'
      - '.github/workflows/checkpoint-10-cross-platform.yml'
      - '.github/workflows/init-targets.yml'
      - '.github/workflows/nightly-deep.yml'
      - '.github/workflows/distribution-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-integrity:
    name: Static test-integrity scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Scan tests and scripts for false-green patterns
        run: |
          python scripts/test_integrity_check.py tests scripts \
            --output .build/bh2/test-integrity-report.json
      - name: Validate guarantee registry structurally (repository-local)
        run: make test-guarantee-registry-ci

  fast-suites:
    name: Fast deterministic contract suites
    needs: static-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Nift
        run: make -j2
      - name: Contract suite
        run: make test-contracts
      - name: Init targets
        run: make test-init-targets
      - name: Pagination incremental equivalence
        run: make test-pagination-equivalence
      - name: Incremental state-transition adversarial (BH4)
        run: make test-incremental-state-transitions
      - name: Parser/value/composition adversarial (BH5)
        run: make test-parser-value-composition
      - name: Init scaffold functional truth (BH6)
        run: make test-init-functional-truth