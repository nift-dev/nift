name: Checkpoint 10 cross-platform equivalence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/checkpoint-10-cross-platform.yml'
      - '.github/workflows/init-targets.yml'
      - '.github/workflows/nightly-deep.yml'
      - '.github/workflows/performance-regression.yml'
      - '.github/workflows/test-integrity.yml'
      - '.github/workflows/distribution-verification.yml'
      - 'Makefile'
      - 'src/**'
      - 'jsonic/**'
      - 'minifypp/**'
      - 'docs/guarantees/**'
      - 'scripts/checkpoint10_cross_platform.py'
      - 'scripts/compare_checkpoint10.py'
      - 'tests/consumer_dependency_snapshots.py'
      - 'tests/shared_dependency_targeted_reproducer.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    name: ${{ matrix.id }} behavioural corpus
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            runner: ubuntu-latest
            runner_os: Linux
          - id: macos
            runner: macos-latest
            runner_os: macOS
          - id: windows
            runner: windows-latest
            runner_os: Windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: make diffutils python mingw-w64-ucrt-x86_64-gcc
      - name: Build Nift
        if: runner.os != 'Windows'
        run: make -j2
      - name: Build Nift on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -j2
      - name: v4.9/v4.10 build, selector, filesystem and JSON contracts
        if: runner.os != 'Windows'
        run: make test-v410-build-pipeline test-v410-file-buffer-parity test-v410-file-buffer-guard test-v410-large-string-parity test-v410-large-string-guard test-v410-filesystem-recipe-parity test-v410-filesystem-recipe-guard test-v410-string-replace-parity test-v410-native-dispatch-parity test-v410-glob-parity test-v410-glob-relative-guard test-v410-glob-prefix-parity test-v410-glob-prefix-guard test-v49-selector-parity test-v49-glob-order test-v49-glob-key-guard test-v49-json-preflight-guard test-runtime-value test-v48-callback-parity test-v48-callback-guard test-v410-sort-factory-parity test-v410-callback-overlay-parity test-v410-callback-overlay-guard test-v410-object-member-parity test-v410-object-member-unit test-v410-object-member-guard test-consumer-snapshots test-process-hardening
      - name: v4.9/v4.10 contracts on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test-v410-build-pipeline test-v410-file-buffer-parity test-v410-file-buffer-guard test-v410-large-string-parity test-v410-large-string-guard test-v410-filesystem-recipe-parity test-v410-filesystem-recipe-guard test-v410-string-replace-parity test-v410-native-dispatch-parity test-v410-glob-parity test-v410-glob-relative-guard test-v410-glob-prefix-parity test-v410-glob-prefix-guard test-v49-selector-parity test-v49-glob-order test-v49-glob-key-guard test-v49-json-preflight-guard test-runtime-value test-v48-callback-parity test-v48-callback-guard test-v410-sort-factory-parity test-v410-callback-overlay-parity test-v410-callback-overlay-guard test-v410-object-member-parity test-v410-object-member-unit test-v410-object-member-guard test-consumer-snapshots test-process-hardening
      - name: Run normalized behavioural corpus
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python scripts/checkpoint10_cross_platform.py \
            --nift "$PWD/nift" \
            --runner-os '${{ matrix.runner_os }}' \
            --output '.build/checkpoint-10/${{ matrix.id }}.json'
      - name: Run normalized behavioural corpus on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          python scripts/checkpoint10_cross_platform.py `
            --nift "$PWD\nift.exe" `
            --runner-os '${{ matrix.runner_os }}' `
            --output '.build\checkpoint-10\${{ matrix.id }}.json'
      - name: Ownership lock+marker unit test (all platforms)
        if: runner.os != 'Windows'
        run: make test-ownership-unit
      - name: Ownership lock+marker unit test on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test-ownership-unit
      - name: Ownership lifecycle/concurrency suite (POSIX)
        if: runner.os != 'Windows'
        run: make test-ownership-concurrency
      - uses: actions/upload-artifact@v7
        with:
          name: checkpoint-10-${{ matrix.id }}
          path: .build/checkpoint-10/${{ matrix.id }}.json
          if-no-files-found: error

  compare:
    name: Compare normalized semantics
    needs: corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: checkpoint-10-*
          path: .build/checkpoint-10/downloaded
          merge-multiple: true
      - name: Compare all portable observations
        run: |
          python scripts/compare_checkpoint10.py \
            .build/checkpoint-10/downloaded/linux.json \
            .build/checkpoint-10/downloaded/macos.json \
            .build/checkpoint-10/downloaded/windows.json \
            --output .build/checkpoint-10/comparison.json
      - uses: actions/upload-artifact@v7
        with:
          name: checkpoint-10-comparison
          path: .build/checkpoint-10/comparison.json
          if-no-files-found: error
