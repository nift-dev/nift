name: Snap

on:
  workflow_call:
  pull_request:
    paths:
      - 'snap/**'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/snap.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: amd64
          - runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - name: Require package and tag versions to agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(sed -nE "s/^version: '([^']+)'/\1/p" snap/snapcraft.yaml)"
          test "$package_version" = "${GITHUB_REF_NAME#v}"
      - uses: snapcore/action-build@v1
        id: snapcraft
      - uses: actions/upload-artifact@v4
        with:
          name: nift-snap-${{ matrix.platform }}
          path: ${{ steps.snapcraft.outputs.snap }}
      - name: Publish stable Snap
        if: startsWith(github.ref, 'refs/tags/v') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable
