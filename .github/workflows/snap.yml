name: Snap

on:
  workflow_call:
  pull_request:
    paths:
      - 'snap/**'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/snap.yml'
  workflow_dispatch:
    inputs:
      publish_edge:
        description: Publish the built snap to edge for strict-confinement testing
        required: false
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: amd64
          - runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require package and tag versions to agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(sed -nE "s/^version: '([^']+)'/\1/p" snap/snapcraft.yaml)"
          test "$package_version" = "${GITHUB_REF_NAME#v}"
      - uses: snapcore/action-build@b391f430cb2650fd359ed4d2cfe88b2c481800e0
        id: snapcraft
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nift-snap-${{ matrix.platform }}
          path: ${{ steps.snapcraft.outputs.snap }}
      - name: Publish edge Snap for confinement testing
        if: github.event_name == 'workflow_dispatch' && inputs.publish_edge && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@9334eecb267cfd97a0ce3c8654215d095927252f
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: edge
      - name: Publish stable Snap
        if: startsWith(github.ref, 'refs/tags/v') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@9334eecb267cfd97a0ce3c8654215d095927252f
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable
