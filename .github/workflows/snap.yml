name: Snap

on:
  workflow_call:
  pull_request:
    paths:
      - 'snap/**'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/snap.yml'
  workflow_dispatch:

jobs:
  # Non-publishing validation builds for amd64 and arm64. These catch build
  # regressions on pull requests and tag runs but never upload to the Snap
  # Store: the connected Snapcraft/Launchpad build service is the sole producer
  # of published revisions (it builds every platform declared in
  # snap/snapcraft.yaml). No Store credential is present in this job.
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: amd64
          - runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require package and tag versions to agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(sed -nE "s/^version: '([^']+)'/\1/p" snap/snapcraft.yaml)"
          test "$package_version" = "${GITHUB_REF_NAME#v}"
      - uses: snapcore/action-build@b391f430cb2650fd359ed4d2cfe88b2c481800e0
        id: snapcraft
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nift-snap-${{ matrix.platform }}
          path: ${{ steps.snapcraft.outputs.snap }}

  # Release coordinator. The connected build service publishes each platform to
  # latest/edge; this job waits until all six declared architectures reach the
  # tagged version on edge, releases exactly those revisions to candidate,
  # verifies the complete candidate set, runs the amd64 candidate confinement
  # smoke, promotes candidate -> stable, and verifies stable. Serialized by a
  # concurrency group so two release tags can never share candidate or stable
  # state. Fails closed on any missing/ambiguous/mismatched revision; stable is
  # untouched by every failure before the promote step.
  release-coordination:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    concurrency:
      group: nift-snap-release-transaction
      cancel-in-progress: false
    env:
      # Exact tested Snapcraft snap revision. This is a genuine immutable pin:
      # the tag release fails closed until a validated revision number is
      # recorded here. The contract test rejects any fallback to a floating
      # channel.
      SNAPCRAFT_SNAP_REVISION: ""
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve release inputs
        shell: bash
        run: |
          echo "NIFT_SNAP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "NIFT_SNAP_WAIT=7200" >> "$GITHUB_ENV"
      - name: Install pinned snapcraft
        shell: bash
        run: |
          test -n "$SNAPCRAFT_SNAP_REVISION" || { echo "SNAPCRAFT_SNAP_REVISION is not set to a tested revision" >&2; exit 1; }
          sudo snap install snapcraft --classic --revision="$SNAPCRAFT_SNAP_REVISION"
          snapcraft version
          snap list snapcraft
      - name: Coordinate candidate staging and stable promotion
        shell: bash
        run: python3 packaging/snap_release.py