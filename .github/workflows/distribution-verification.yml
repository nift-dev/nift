name: Distribution verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Public Nift version to require from every selected channel (for example 4.0.12)
        required: true
        type: string
      github_release:
        description: Verify public GitHub release archives
        required: true
        default: true
        type: boolean
      homebrew:
        description: Verify canonical Homebrew formula
        required: true
        default: true
        type: boolean
      chocolatey:
        description: Verify Chocolatey Community Repository package
        required: true
        default: true
        type: boolean
      snap_edge:
        description: Verify the release version reached Snap Store latest/edge (promotion readiness)
        required: true
        default: false
        type: boolean
      snap_stable:
        description: Verify Snap Store latest/stable (maintained public-release gate)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate_version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Require a strict X.Y.Z release version
        shell: bash
        run: |
          version='${{ inputs.version }}'
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          echo "validated version: $version"

  github_release:
    if: inputs.github_release
    needs: validate_version
    name: GitHub release / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
            archive: tar.gz
            executable: nift
          - runner: macos-15
            platform: macos-arm64
            archive: tar.gz
            executable: nift
          - runner: macos-15-intel
            platform: macos-x86_64
            archive: tar.gz
            executable: nift
          - runner: windows-latest
            platform: windows-x86_64
            archive: zip
            executable: nift.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Download and extract public release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version='${{ inputs.version }}'
          root="nift-$version-${{ matrix.platform }}"
          url="https://github.com/nift-dev/nift/releases/download/v$version/$root.${{ matrix.archive }}"
          mkdir -p .build/distribution/release
          curl --fail --location --retry 5 --retry-delay 3 "$url" -o ".build/distribution/$root.${{ matrix.archive }}"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://github.com/nift-dev/nift/releases/download/v$version/SHA256SUMS" \
            -o .build/distribution/SHA256SUMS
          (cd .build/distribution && grep "  $root.${{ matrix.archive }}$" SHA256SUMS | sha256sum --check -)
          tar -xzf ".build/distribution/$root.${{ matrix.archive }}" -C .build/distribution/release
          echo "NIFT_EXE=$PWD/.build/distribution/release/$root/${{ matrix.executable }}" >> "$GITHUB_ENV"
      - name: Download and extract public release archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $root = "nift-$version-${{ matrix.platform }}"
          $url = "https://github.com/nift-dev/nift/releases/download/v$version/$root.${{ matrix.archive }}"
          New-Item .build/distribution/release -ItemType Directory -Force | Out-Null
          $archive = ".build/distribution/$root.${{ matrix.archive }}"
          Invoke-WebRequest $url -OutFile $archive -MaximumRetryCount 5 -RetryIntervalSec 3
          Invoke-WebRequest "https://github.com/nift-dev/nift/releases/download/v$version/SHA256SUMS" -OutFile .build/distribution/SHA256SUMS -MaximumRetryCount 5 -RetryIntervalSec 3
          $filename = "$root.${{ matrix.archive }}"
          $line = Get-Content .build/distribution/SHA256SUMS | Where-Object { $_.EndsWith("  $filename") } | Select-Object -First 1
          if (-not $line) { throw "Checksum entry not found for $filename" }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Checksum mismatch for $filename" }
          Expand-Archive $archive -DestinationPath .build/distribution/release
          "NIFT_EXE=$PWD\.build\distribution\release\$root\${{ matrix.executable }}" >> $env:GITHUB_ENV
      - name: Smoke installed release archive
        shell: bash
        run: |
          python scripts/distribution_smoke.py \
            --channel 'github-release-${{ matrix.platform }}' \
            --expected-version '${{ inputs.version }}' \
            --evidence '.build/distribution/evidence/github-release-${{ matrix.platform }}.json' \
            --command "$NIFT_EXE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: distribution-github-release-${{ matrix.platform }}
          path: .build/distribution/evidence/*.json
          if-no-files-found: error

  homebrew:
    if: inputs.homebrew
    needs: validate_version
    name: Homebrew / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-latest
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          core: true
          cask: false
      - name: Fresh install from Homebrew
        shell: bash
        run: |
          brew update
          brew uninstall --force nift >/dev/null 2>&1 || true
          brew install nift
      - name: Smoke public Homebrew package
        shell: bash
        run: |
          python scripts/distribution_smoke.py \
            --channel 'homebrew-${{ matrix.platform }}' \
            --expected-version '${{ inputs.version }}' \
            --evidence '.build/distribution/evidence/homebrew-${{ matrix.platform }}.json' \
            --command nift
      - name: Uninstall Homebrew package
        if: always()
        shell: bash
        run: brew uninstall --force nift >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: distribution-homebrew-${{ matrix.platform }}
          path: .build/distribution/evidence/*.json
          if-no-files-found: warn

  chocolatey:
    if: inputs.chocolatey
    needs: validate_version
    name: Chocolatey / windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Fresh install from Chocolatey Community Repository
        shell: pwsh
        run: |
          choco uninstall nift -y --no-progress 2>$null | Out-Null
          choco install nift --version '${{ inputs.version }}' -y --no-progress
      - name: Smoke public Chocolatey package
        shell: pwsh
        run: |
          python scripts/distribution_smoke.py `
            --channel chocolatey-windows-x86_64 `
            --expected-version '${{ inputs.version }}' `
            --evidence '.build/distribution/evidence/chocolatey-windows-x86_64.json' `
            --command nift
      - name: Uninstall Chocolatey package
        if: always()
        shell: pwsh
        run: choco uninstall nift -y --no-progress 2>$null | Out-Null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: distribution-chocolatey-windows-x86_64
          path: .build/distribution/evidence/*.json
          if-no-files-found: warn

  snap_edge:
    if: inputs.snap_edge
    needs: validate_version
    name: Snap edge / linux-x86_64
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.classify.outputs.status }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Fresh install from Snap edge
        shell: bash
        run: |
          sudo snap remove nift >/dev/null 2>&1 || true
          sudo snap install nift --channel=latest/edge
      - name: Smoke public Snap edge package
        shell: bash
        run: |
          python scripts/distribution_smoke.py \
            --channel snap-edge-linux-x86_64 \
            --expected-version '${{ inputs.version }}' \
            --evidence '.build/distribution/evidence/snap-edge-linux-x86_64.json' \
            --command nift
      - name: Classify edge result
        id: classify
        if: always()
        shell: bash
        run: |
          evidence='.build/distribution/evidence/snap-edge-linux-x86_64.json'
          status='install_runtime_failure'
          if [ -f "$evidence" ]; then
            status="$(python3 -c "import json; d=json.load(open('$evidence')); print('passed' if d['status']=='passed' else ('version_mismatch' if 'version mismatch' in d.get('error','') else 'install_runtime_failure'))")"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "snap edge status: $status"
      - name: Uninstall Snap package
        if: always()
        shell: bash
        run: sudo snap remove nift >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: distribution-snap-edge-linux-x86_64
          path: .build/distribution/evidence/*.json
          if-no-files-found: warn

  snap_stable:
    if: inputs.snap_stable
    needs: validate_version
    name: Snap stable / linux-x86_64
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.classify.outputs.status }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Fresh install from Snap stable
        shell: bash
        run: |
          sudo snap remove nift >/dev/null 2>&1 || true
          sudo snap install nift --channel=latest/stable
      - name: Smoke public Snap stable package
        shell: bash
        run: |
          python scripts/distribution_smoke.py \
            --channel snap-stable-linux-x86_64 \
            --expected-version '${{ inputs.version }}' \
            --evidence '.build/distribution/evidence/snap-stable-linux-x86_64.json' \
            --command nift
      - name: Classify stable result
        id: classify
        if: always()
        shell: bash
        run: |
          evidence='.build/distribution/evidence/snap-stable-linux-x86_64.json'
          status='install_runtime_failure'
          if [ -f "$evidence" ]; then
            status="$(python3 -c "import json; d=json.load(open('$evidence')); print('passed' if d['status']=='passed' else ('version_mismatch' if 'version mismatch' in d.get('error','') else 'install_runtime_failure'))")"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "snap stable status: $status"
      - name: Uninstall Snap package
        if: always()
        shell: bash
        run: sudo snap remove nift >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: distribution-snap-stable-linux-x86_64
          path: .build/distribution/evidence/*.json
          if-no-files-found: warn

  summary:
    if: always()
    name: Distribution summary
    needs: [validate_version, github_release, homebrew, chocolatey, snap_edge, snap_stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Record selected channel results
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          VALIDATE_VERSION_RESULT: ${{ needs.validate_version.result }}
          GITHUB_RELEASE_SELECTED: ${{ inputs.github_release }}
          HOMEBREW_SELECTED: ${{ inputs.homebrew }}
          CHOCOLATEY_SELECTED: ${{ inputs.chocolatey }}
          SNAP_EDGE_SELECTED: ${{ inputs.snap_edge }}
          SNAP_STABLE_SELECTED: ${{ inputs.snap_stable }}
          GITHUB_RELEASE_RESULT: ${{ needs.github_release.result }}
          HOMEBREW_RESULT: ${{ needs.homebrew.result }}
          CHOCOLATEY_RESULT: ${{ needs.chocolatey.result }}
          SNAP_EDGE_RESULT: ${{ needs.snap_edge.result }}
          SNAP_STABLE_RESULT: ${{ needs.snap_stable.result }}
          SNAP_EDGE_STATUS: ${{ needs.snap_edge.outputs.status }}
          SNAP_STABLE_STATUS: ${{ needs.snap_stable.outputs.status }}
        shell: bash
        run: |
          mkdir -p .build/distribution
          python scripts/distribution_summary.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distribution-summary
          path: .build/distribution/summary.json
          if-no-files-found: error
