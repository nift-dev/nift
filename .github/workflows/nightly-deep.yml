name: Deep guards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-fuzz:
    name: Checkpoint 9 parser fuzz (sanitized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build sanitized Nift
        run: make -j2 .build/nift-sanitize
      - name: Fuzz the parser under sanitizers
        run: |
          env -u LD_PRELOAD python3 scripts/checkpoint9_parser_fuzz.py \
            --nift "$PWD/.build/nift-sanitize" \
            --cases 400 \
            --seeds 9001,17713,424242 \
            --output .build/checkpoint-9/parser-fuzz.json

  core-memory:
    name: Checkpoint 3 core lifecycle (sanitized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build sanitized Nift
        run: make -j2 .build/nift-sanitize
      - name: Core lifecycle memory safety
        run: |
          env -u LD_PRELOAD python3 scripts/checkpoint3_core_memory.py \
            --nift "$PWD/.build/nift-sanitize" \
            --rounds 4 \
            --output .build/memory-safety/checkpoint-3-core.json

  endurance:
    name: Checkpoint 4 watch endurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build Nift
        run: make -j2
      - name: Watch-mode endurance soak
        run: |
          python3 scripts/checkpoint4_watch_endurance.py \
            --nift "$PWD/nift" \
            --cycles 180 \
            --interval 0.22 \
            --output .build/memory-safety/checkpoint-4-watch-rss.json

  checkpoint6:
    name: Checkpoint 6 integration (shared-data isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build Nift
        run: make -j2
      - name: Checkpoint 6 integration memory safety
        # Single source of truth: the sibling-free execution target owns the
        # checkpoint-6 script invocation and its parameters, so the workflow
        # cannot drift from the canonical definition.
        run: make memory-safety-checkpoint-6-run

  incremental-equivalence:
    name: Checkpoint 7 incremental equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build Nift
        run: make -j2
      - name: Incremental clean-build equivalence
        run: |
          python3 scripts/checkpoint7_incremental_equivalence.py \
            --nift "$PWD/nift" \
            --seeds 8 \
            --steps 30 \
            --output .build/checkpoint-7/incremental-equivalence.json

  warnings:
    name: First-party warnings as errors (GCC + Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Zero first-party compiler warnings (release-blocking invariant)
        shell: bash
        run: |
          set -euo pipefail
          make test-warnings

  package-ecosystem-contract:
    name: Package ecosystem contract (12/12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build Nift (exact SHA under certification)
        run: make -j2
      - name: Record packages-regression-suite (pinned commit)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/nift-dev/packages-regression-suite.git packages-regression-suite
          git -C packages-regression-suite fetch --no-tags origin 26a8a0fb281a4329a9eb32f130320ffdf8b2c42d
          git -C packages-regression-suite checkout -q FETCH_HEAD
          echo "packages-regression-suite=$(git -C packages-regression-suite rev-parse HEAD)"
      - name: Resolve clean official package sources + source manifest
        shell: bash
        run: bash packages-regression-suite/scripts/record_package_sources.sh package-sources.json
      - name: Run package ecosystem contract (12 modules, fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          NIFT_BIN="$PWD/nift" bash packages-regression-suite/run.sh
      - name: Report exact certification identities
        shell: bash
        run: |
          set -euo pipefail
          echo "nift=${{ github.sha }}"
          echo "packages-regression-suite=$(git -C packages-regression-suite rev-parse HEAD)"
          echo "package-source manifest: package-sources.json (uploaded artifact)"
      - name: Upload package-source manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-sources
          path: package-sources.json