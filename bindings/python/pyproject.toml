[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nift"
version = "0.1.0"
description = "Nift Embed Python binding: Nift template rendering for Python applications (CPython C extension over the frozen Nift C ABI)."
requires-python = ">=3.10"

[tool.setuptools]
packages = ["nift"]
